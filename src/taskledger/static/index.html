<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>taskledger</title>
<!-- C-2: no external resources; all CSS/JS inline. Relative API URLs only. -->
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a2e; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: .5rem .9rem; border: 0; border-radius: 6px; background: #3a6df0; color: #fff; cursor: pointer; }
  li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #eee; }
  li.done span { text-decoration: line-through; color: #888; }
  li span { flex: 1; }
  .del { background: #e05252; padding: .2rem .6rem; }
  #status { font-size: .8rem; color: #666; }
</style>
</head>
<body>
<h1>taskledger</h1>
<form id="add">
  <input id="title" type="text" placeholder="New task…" required>
  <button type="submit">Add</button>
</form>
<ul id="list"></ul>
<p id="status">loading…</p>
<script>
const list = document.getElementById('list'), status = document.getElementById('status');
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined });
  return r.status === 204 ? null : r.json();
}
async function refresh() {
  const { tasks } = await api('GET', '/api/tasks');
  list.innerHTML = '';
  for (const t of tasks) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = async () => { await api('PATCH', '/api/tasks/' + t.id, {done: cb.checked}); refresh(); };
    const span = document.createElement('span'); span.textContent = t.title;
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
    del.onclick = async () => { await api('DELETE', '/api/tasks/' + t.id); refresh(); };
    li.append(cb, span, del); list.append(li);
  }
  status.textContent = tasks.length + ' task(s) — ' + new Date().toLocaleTimeString();
}
document.getElementById('add').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('title');
  await api('POST', '/api/tasks', {title: input.value});
  input.value = ''; refresh();
};
refresh();
</script>
</body>
</html>
